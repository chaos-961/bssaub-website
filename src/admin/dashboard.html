<!-- Encrypted admin dashboard markup (v0.5.6, user brief: show every member in
     pages rather than only what a search turns up, with a filter for All,
     Subscribed and Unsubscribed beside the search bar that stays as it was,
     empty placeholder rows while a page is on its way, and a subscription that
     runs by the YEAR rather than by the month).

     This file is NOT served. It is encrypted into public/admin-payload.json by
     scripts/build-admin-payload.mjs and only exists as plaintext in the repo
     and in the browser of whoever typed the password. Re-run the encryptor
     after every edit here (npm run admin:payload), or the build gate fails.

     A <template> holds the result row rather than dashboard.js building one
     from strings, and that is a security decision and not a tidiness one: a
     member's name and email are whatever THEY typed at registration, so every
     one of them is written with textContent into a node that already exists.
     There is no string concatenation anywhere near this markup.

     The second <template> is the placeholder row. It is a copy of the real
     row's SKELETON, same grid, same padding, same three action slots, so the
     list does not jolt when the real rows replace it. aria-hidden, because a
     screen reader is told what is happening by the status line instead, and
     eight announcements of nothing would be worse than silence.

     THERE IS NO BAR HERE ANY MORE. Sign out and View site are the admin
     template's top bar, and the two lids below are its tabs: an Overview that
     counts the society, and the member console itself. -->

<div data-bss="overview">
  <!-- Three reads, once, when the tab opens. The same count() the pager uses,
       so the figures here and the pages there can never disagree. -->
  <div class="adm-tiles">
    <div class="adm-tile">
      <p class="adm-tile__l">Members</p>
      <p class="adm-tile__n" data-admin-total-all>&mdash;</p>
      <p class="adm-tile__s">on the register</p>
    </div>
    <div class="adm-tile">
      <p class="adm-tile__l">Subscribed</p>
      <p class="adm-tile__n" data-admin-total-live>&mdash;</p>
      <p class="adm-tile__s">membership running</p>
    </div>
    <div class="adm-tile">
      <p class="adm-tile__l">Unsubscribed</p>
      <p class="adm-tile__n" data-admin-total-off>&mdash;</p>
      <p class="adm-tile__s">lapsed or never started</p>
    </div>
  </div>
  <p class="adm-note" data-admin-total-note></p>
</div>

<div data-bss="members">
<main class="admin-console">

  <div class="admin-tools">
    <form class="admin-search" data-admin-search novalidate>
      <label class="admin-search__label" for="admin-q">Search by name or email address</label>
      <div class="admin-search__row">
        <input
          class="auth__input"
          id="admin-q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Type a name"
          data-admin-query
        />
        <button class="btn btn--primary" type="submit" data-admin-go>Search</button>
      </div>
    </form>

    <!-- Three buttons rather than a menu behind the funnel, deliberately. A
         popup would cost two taps to reach any option, plus outside press,
         escape and focus handling, to hide three words. The icon is what the
         brief asked for and it is here as the group's own label. -->
    <div class="admin-filter">
      <span class="admin-filter__legend" id="admin-filter-label">
        <svg class="admin-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2 3.5h12M4.5 8h7M7 12.5h2" />
        </svg>
        Show
      </span>
      <div class="admin-filter__set" role="group" aria-labelledby="admin-filter-label" data-admin-filter>
        <button class="admin-filter__opt" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="admin-filter__opt" type="button" data-filter="live" aria-pressed="false">Subscribed</button>
        <button class="admin-filter__opt" type="button" data-filter="off" aria-pressed="false">Unsubscribed</button>
      </div>
    </div>
  </div>

  <!-- A popup at the top of the page rather than a line above the rows since
       v0.5.8 (user call). It starts hidden so an empty pill never paints
       before the first message; dashboard.js owns the attribute from then on
       and auth.css keys the entrance to display, so each message replays it. -->
  <p class="admin-console__status" data-admin-console-status role="status" aria-live="polite" hidden></p>

  <ul class="admin-results" data-admin-results></ul>

  <nav class="admin-pager" data-admin-pager hidden aria-label="Member pages">
    <button class="btn btn--sm btn--ghost" type="button" data-page="prev">Previous</button>
    <div class="admin-pager__numbers" data-admin-pager-numbers></div>
    <button class="btn btn--sm btn--ghost" type="button" data-page="next">Next</button>
  </nav>
</main>
</div>

<template data-admin-row>
  <li class="admin-row">
    <!-- Identity and state are ONE grid child so the wide layout can be two
         columns rather than three. Three never fitted: the action buttons and
         the state pill together are wider than the row, which squeezed the
         name column to zero and broke each name onto one character a line. -->
    <div class="admin-row__main">
      <div class="admin-row__who">
        <strong class="admin-row__name" data-row-name></strong>
        <span class="admin-row__email" data-row-email></span>
      </div>
      <span class="state-pill" data-row-state></span>
    </div>
    <div class="admin-row__actions" data-row-actions>
      <button class="btn btn--sm btn--primary" type="button" data-act="add">Add 1 year</button>
      <button class="btn btn--sm btn--ghost" type="button" data-act="sub">Remove 1 year</button>
      <button class="btn btn--sm btn--ghost admin-row__danger" type="button" data-act="ask">
        Delete
      </button>
    </div>
    <div class="admin-row__confirm" data-row-confirm hidden>
      <p class="admin-row__warn">
        Delete this member forever? Their account and their days go with them, and
        this cannot be undone.
      </p>
      <div class="admin-row__actions">
        <button class="btn btn--sm admin-row__danger admin-row__danger--solid" type="button" data-act="delete">
          Yes, delete
        </button>
        <button class="btn btn--sm btn--ghost" type="button" data-act="cancel">Cancel</button>
      </div>
    </div>
  </li>
</template>

<template data-admin-skeleton>
  <li class="admin-row admin-row--skeleton" aria-hidden="true">
    <div class="admin-row__main">
      <div class="admin-row__who">
        <span class="skel skel--name"></span>
        <span class="skel skel--email"></span>
      </div>
      <span class="skel skel--pill"></span>
    </div>
    <div class="admin-row__actions">
      <span class="skel skel--btn"></span>
      <span class="skel skel--btn"></span>
      <span class="skel skel--btn skel--btn-tight"></span>
    </div>
  </li>
</template>
